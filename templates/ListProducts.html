<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% for product in prdcts %}
    <div>
        <h1><a href="{% url 'Tous les produits' %}">{{ product.name }}</a></h1>
        <p>{{ product.price }}</p>
        <p>{{ product.statut.libelle }}</p>
    </div>
{% endfor %}
    <p>J'ai {{ prdcts | length }} produits préférés.</p>
</body>
</html>
