

{% extends "base.html" %}
{% block content %}
    <h1>{{product.name}}</h1>
    <div class="champ">
        <label for="price">Prix HT</label>
        <span id="price">{{product.price_ht}}</span>
    </div>
    <div class="champ">
        <label for="price">Prix TTC</label>
        <span id="price">{{product.price_ttc}}</span>
    </div>
    <div class="champ">
        <label for="price">Disponibilité</label>
        <span id="price">{{product.status}}</span>
    </div>
    <a href="{%  url 'product-update' product.id %}">Modifier</a>
    <a href="{%  url 'product-delete' product.id %}">Supprimer</a>
    <br>
    
    <a href="{% url 'product-list' %}">Retour à la liste des produits</a>
{% endblock %}
